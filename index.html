<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PJECZ Sistema de Citas - Mantenimiento</title>
        <style>
            /* CSS Convencional */
            body {
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background-color: #ffffff;
                font-family: Arial, sans-serif;
                text-align: center;
            }

            .container {
                width: 420px;
            }

            .logo-placeholder {
                width: 400px;
                height: 300px;
                background-color: #f0f0f0; /* Color de fondo si no hay imagen */
                display: flex;
                justify-content: center;
                align-items: center;
                margin-bottom: 20px;
                border: 1px solid #ddd;
            }

            img {
                max-width: 100%;
                height: auto;
            }

            h1 {
                font-size: 24px;
                color: #333;
                margin: 0 0 10px 0;
            }

            .mensaje {
                margin-top: 10px;
                font-size: 18px;
                color: #444;
            }

            .submensaje {
                margin-top: 8px;
                font-size: 14px;
                color: #666;
            }

            .info {
                margin-top: 18px;
                font-size: 13px;
                color: #888;
            }

            .contacto {
                margin-top: 12px;
                font-size: 13px;
                color: #444;
                text-decoration: none;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="logo-placeholder">
                <img src="logo.png" alt="Logotipo" width="400" height="250" />
            </div>

            <h1>Sistema de Citas</h1>

            <p class="mensaje">ESTE SISTEMA SE ENCUENTRA EN MANTENIMIENTO</p>
            <p class="submensaje">
                Próximamente estará disponible una nueva versión.
            </p>

            <p class="info">Gracias por su paciencia.</p>

            <!-- Opcional: enlace al sistema o contacto (desactivado mientras haya mantenimiento) -->
            <a class="contacto" href="https://www.pjecz.gob.mx/">
                Poder Judicial del Estado de Coahuila de Zaragoza
            </a>
        </div>

        <!-- No hay redirección automática mientras el sistema está en mantenimiento -->
    </body>
</html>
